<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Acceso con Ticket</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(120deg, #12c2e9, #c471ed, #f64f59);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-panel {
            background: rgba(0, 0, 0, 0.4);
            padding: 45px 35px;
            border-radius: 25px;
            width: 95%;
            max-width: 420px;
            text-align: center;
            color: white;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            animation: fadeIn 1.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(35px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icono {
            font-size: 60px;
            color: #ffd700;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 14px;
            color: #eee;
            margin-bottom: 25px;
        }

        form {
            text-align: left;
        }

        form p {
            margin-bottom: 15px;
        }

        label {
            font-size: 14px;
            margin-bottom: 5px;
            display: block;
            color: #ffffff;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.7);
        }

        button {
            margin-top: 10px;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 180, 255, 0.6);
        }

        .error {
            margin-top: 15px;
            padding: 10px;
            border-radius: 10px;
            background: rgba(255, 0, 0, 0.2);
            color: #ffb3b3;
            font-size: 14px;
        }

        .extra {
            margin-top: 18px;
            font-size: 13px;
            color: #ddd;
        }

        .extra a {
            color: #00f2fe;
            text-decoration: none;
            font-weight: 600;
        }

        .extra a:hover {
            text-decoration: underline;
        }

        footer {
            margin-top: 20px;
            font-size: 12px;
            color: #ccc;
        }
    </style>
</head>

<body>

    <div class="login-panel">

        <div class="icono">
            <i class="fa-solid fa-ticket"></i>
        </div>

        <h1>Acceso con Ticket</h1>
        <p class="subtitle">
            Ingresa tu número de ticket para continuar
        </p>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> Ingresar
            </button>
        </form>

        {% if error %}
        <div class="error">
            <i class="fa-solid fa-triangle-exclamation"></i> {{ error }}
        </div>
        {% endif %}

        <div class="extra">
            ¿Eres administrador?
            <a href="/admin/">Ingresar aquí</a>
        </div>

        <footer>
            © 2025 - Sistema Profesional de Rifas
        </footer>

    </div>

</body>

</html>
