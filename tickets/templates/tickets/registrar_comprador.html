<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Registro del Comprador</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(120deg, #1f4037, #99f2c8);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .registro-panel {
            background: rgba(0, 0, 0, 0.45);
            padding: 40px 35px;
            border-radius: 25px;
            width: 100%;
            max-width: 460px;
            color: white;
            text-align: center;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            animation: fadeIn 1.2s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(35px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icono {
            font-size: 60px;
            color: #00ffcc;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 8px;
        }

        .ticket-box {
            background: rgba(0, 255, 204, 0.18);
            border: 1px solid rgba(0, 255, 204, 0.5);
            padding: 12px;
            border-radius: 14px;
            font-size: 15px;
            margin: 15px 0 25px 0;
            color: #9dfff0;
        }

        form {
            text-align: left;
        }

        form p {
            margin-bottom: 14px;
        }

        label {
            font-size: 14px;
            margin-bottom: 5px;
            display: block;
            color: #ffffff;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            outline: none;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.7);
        }

        button {
            margin-top: 18px;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 180, 255, 0.6);
        }

        footer {
            margin-top: 22px;
            font-size: 12px;
            color: #ccc;
        }
    </style>
</head>

<body>

    <div class="registro-panel">

        <div class="icono">
            <i class="fa-solid fa-user-check"></i>
        </div>

        <h1>Registro del Comprador</h1>

        <div class="ticket-box">
            <i class="fa-solid fa-ticket"></i>
            <strong>Ticket asignado:</strong> {{ ticket.numero }}
        </div>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">
                <i class="fa-solid fa-floppy-disk"></i> Registrar Comprador
            </button>
        </form>

        <footer>
            © 2025 - Registro Oficial de Compradores | Sistema de Rifas
        </footer>

    </div>

</body>

</html>
