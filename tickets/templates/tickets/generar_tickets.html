<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Generar Tickets</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(120deg, #141e30, #243b55);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .admin-panel {
            background: rgba(0, 0, 0, 0.45);
            padding: 45px 35px;
            border-radius: 25px;
            width: 95%;
            max-width: 450px;
            color: white;
            text-align: center;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            animation: fadeIn 1.2s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(35px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icono {
            font-size: 60px;
            color: #00eaff;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #ddd;
            margin-bottom: 25px;
        }

        form {
            text-align: left;
        }

        form p {
            margin-bottom: 14px;
        }

        label {
            font-size: 14px;
            margin-bottom: 5px;
            display: block;
            color: #ffffff;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            outline: none;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.7);
        }

        button {
            margin-top: 15px;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 180, 255, 0.6);
        }

        .volver {
            margin-top: 20px;
            display: inline-block;
            font-size: 14px;
            color: #00eaff;
            text-decoration: none;
            transition: 0.3s;
        }

        .volver:hover {
            text-decoration: underline;
        }

        footer {
            margin-top: 20px;
            font-size: 12px;
            color: #ccc;
        }
    </style>
</head>

<body>

    <div class="admin-panel">

        <div class="icono">
            <i class="fa-solid fa-gears"></i>
        </div>

        <h1>Generar Tickets</h1>
        <p class="subtitle">
            Crea tickets de forma automática por rango
        </p>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">
                <i class="fa-solid fa-microchip"></i> Generar Tickets
            </button>
        </form>

        <a href="/admin/" class="volver">
            <i class="fa-solid fa-arrow-left"></i> Volver al administrador
        </a>

        <footer>
            © 2025 - Panel Administrativo del Sistema de Rifas
        </footer>

    </div>

</body>

</html>
