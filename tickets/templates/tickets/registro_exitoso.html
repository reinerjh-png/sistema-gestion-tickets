<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Registro Exitoso</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(120deg, #11998e, #38ef7d);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .success-panel {
            background: rgba(0, 0, 0, 0.45);
            padding: 45px 35px;
            border-radius: 28px;
            width: 100%;
            max-width: 520px;
            color: white;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            animation: fadeIn 1.2s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(35px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon-success {
            font-size: 85px;
            color: #00ff9d;
            margin-bottom: 18px;
            animation: pop 0.6s ease;
        }

        @keyframes pop {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        p {
            font-size: 15px;
            color: #eaeaea;
            margin-bottom: 30px;
        }

        .acciones {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            justify-content: center;
        }

        .btn {
            text-decoration: none;
            padding: 13px 26px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 18px rgba(0, 180, 255, 0.6);
        }

        .btn.secundario {
            background: linear-gradient(135deg, #ff512f, #dd2476);
        }

        footer {
            margin-top: 30px;
            font-size: 12px;
            color: #ccc;
        }
    </style>
</head>

<body>

    <div class="success-panel">

        <div class="icon-success">
            <i class="fa-solid fa-circle-check"></i>
        </div>

        <h1>✅ Registro Exitoso</h1>

        <p>Tu ticket ha sido registrado correctamente. Ya estás participando en el sorteo oficial.</p>

        <div class="acciones">
            <a href="/" class="btn">
                <i class="fa-solid fa-house"></i> Ir al Inicio
            </a>

            <a href="/tickets/reporte/" class="btn secundario">
                <i class="fa-solid fa-chart-line"></i> Ver Reporte
            </a>
        </div>

        <footer>
            © 2025 - Confirmación Oficial | Sistema de Rifas
        </footer>

    </div>

</body>

</html>
